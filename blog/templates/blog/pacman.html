<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pac-Man</title>
<style>
  :root {
    --wall: #2121de;
    --bg: #000;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #fff;
    font-family: "Courier New", Courier, monospace;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100%;
    padding: 16px 8px 32px;
  }
  h1 {
    margin: 0 0 12px;
    letter-spacing: 4px;
    color: #ffe600;
    text-shadow: 0 0 8px rgba(255,230,0,.6);
    font-size: 28px;
  }
  #game-wrap {
    position: relative;
    max-width: 100%;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    padding: 4px 6px;
    font-size: 15px;
    background: var(--bg);
  }
  #hud .lives { color: #ffe600; letter-spacing: 2px; }
  canvas {
    display: block;
    background: var(--bg);
    max-width: 100%;
    height: auto;
    image-rendering: crisp-edges;
    border: 2px solid #333;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.78);
    text-align: center;
    padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 {
    color: #ffe600;
    margin: 0 0 8px;
    font-size: 22px;
  }
  #overlay p {
    margin: 4px 0 16px;
    font-size: 13px;
    color: #ccc;
    line-height: 1.6;
  }
  button.game-btn {
    background: #2121de;
    color: #fff;
    border: 2px solid #5555ff;
    padding: 10px 22px;
    font-family: inherit;
    font-size: 15px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  button.game-btn:active { background: #4040ff; }
  #touch-controls {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 4px;
    margin-top: 14px;
    user-select: none;
  }
  #touch-controls button {
    background: #222;
    border: 2px solid #444;
    color: #ffe600;
    font-size: 20px;
    border-radius: 8px;
    touch-action: manipulation;
  }
  #touch-controls button:active { background: #444; }
  .tc-up { grid-column: 2; grid-row: 1; }
  .tc-left { grid-column: 1; grid-row: 2; }
  .tc-right { grid-column: 3; grid-row: 2; }
  .tc-down { grid-column: 2; grid-row: 3; }
  @media (hover: none) and (pointer: coarse) {
    #touch-controls { display: grid; }
  }
  #hint {
    margin-top: 10px;
    font-size: 12px;
    color: #777;
  }
</style>
</head>
<body>
  <h1>PAC-MAN</h1>
  <div id="game-wrap">
    <div id="hud">
      <span>SCORE: <span id="score">0</span></span>
      <span>HIGH: <span id="highscore">0</span></span>
      <span class="lives" id="lives">♥♥♥</span>
    </div>
    <canvas id="board" width="504" height="504"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">PAC-MAN</h2>
      <p id="overlay-text">矢印キー / WASD で移動<br>すべてのドットを食べればクリア<br>パワーエサでゴーストを逆に食べられる</p>
      <button class="game-btn" id="overlay-btn">START</button>
    </div>
  </div>
  <div id="touch-controls">
    <button class="tc-up" data-dir="up">▲</button>
    <button class="tc-left" data-dir="left">◀</button>
    <button class="tc-right" data-dir="right">▶</button>
    <button class="tc-down" data-dir="down">▼</button>
  </div>
  <div id="hint">Arrow keys / WASD to move &middot; P to pause</div>

<script>
(function () {
  "use strict";

  // ---------- Maze definition ----------
  // '#' wall, '.' dot, 'o' power pellet, ' ' empty path, '-' ghost-house door
  const MAZE = [
    "#####################",
    "#o######.....######o#",
    "#.##.###.....###.##.#",
    "#.##.###.....###.##.#",
    "#...................#",
    "###..###.....###..###",
    "###..###.....###..###",
    "#...................#",
    "#.##..###---###..##.#",
    "#.##..##     ##..##.#",
    " ......#     #...... ",
    "#.##..##     ##..##.#",
    "#.##..#########..##.#",
    "#...................#",
    "###..###.....###..###",
    "###..###.....###..###",
    "#...................#",
    "#.##.###.....###.##.#",
    "#.##.###.....###.##.#",
    "#o######.....######o#",
    "#####################",
  ];

  const ROWS = MAZE.length;
  const COLS = MAZE[0].length;
  const TILE = 24;
  const TUNNEL_ROW = 10;

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;

  // mutable board state: dots/pellets get eaten
  let board = MAZE.map((row) => row.split(""));

  function tileAt(row, col) {
    if (row < 0 || row >= ROWS) return "#";
    if (col < 0) col = COLS - 1;
    if (col >= COLS) col = 0;
    return board[row][col];
  }

  function isWallFor(entityType, row, col) {
    const ch = tileAt(row, col);
    if (ch === "#") return true;
    if (ch === "-" && entityType === "pacman") return true;
    return false;
  }

  // ---------- Directions ----------
  const DIR = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 },
    none: { x: 0, y: 0 },
  };
  function opposite(d) {
    if (d === "up") return "down";
    if (d === "down") return "up";
    if (d === "left") return "right";
    if (d === "right") return "left";
    return "none";
  }

  // ---------- Score / lives ----------
  let score = 0;
  let lives = 3;
  let highscore = Number(localStorage.getItem("pacman_highscore") || 0);
  let dotsRemaining = 0;
  let frightenedTimer = 0;
  let frightenedTotal = 7000; // ms
  let ghostEatCombo = 0;
  let running = false;
  let paused = false;
  let gameOverFlag = false;
  let wonFlag = false;

  document.getElementById("highscore").textContent = highscore;

  function countDots() {
    let n = 0;
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (board[r][c] === "." || board[r][c] === "o") n++;
    return n;
  }

  // ---------- Entities ----------
  // Entities move tile-by-tile: {row,col} is the tile last departed from, `dir`
  // is the direction of travel, and `progress` (0..1) is how far along that
  // move it is. Pixel position is derived from these, never stored directly -
  // this avoids float-snapping bugs where re-centering every frame cancels
  // out the movement that just happened.
  function tileCenter(row, col) {
    return { x: col * TILE + TILE / 2, y: row * TILE + TILE / 2 };
  }

  function entityPixelPos(e) {
    const d = DIR[e.dir] || DIR.none;
    return {
      x: e.col * TILE + TILE / 2 + d.x * e.progress * TILE,
      y: e.row * TILE + TILE / 2 + d.y * e.progress * TILE,
    };
  }

  function makePacman() {
    return {
      row: 16,
      col: 10,
      dir: "left",
      nextDir: "left",
      progress: 0,
      speed: 0.0039, // tiles per ms
      mouth: 0,
      mouthDir: 1,
    };
  }

  const GHOST_DEFS = [
    { name: "blinky", color: "#ff0000", home: { row: 9, col: 10 }, scatter: { row: 0, col: COLS - 1 } },
    { name: "pinky", color: "#ffb8ff", home: { row: 10, col: 8 }, scatter: { row: 0, col: 0 } },
    { name: "inky", color: "#00ffff", home: { row: 10, col: 12 }, scatter: { row: ROWS - 1, col: COLS - 1 } },
    { name: "clyde", color: "#ffb851", home: { row: 11, col: 10 }, scatter: { row: ROWS - 1, col: 0 } },
  ];

  function makeGhosts() {
    return GHOST_DEFS.map((def) => {
      return {
        name: def.name,
        color: def.color,
        row: def.home.row,
        col: def.home.col,
        homeRow: def.home.row,
        homeCol: def.home.col,
        scatterTarget: def.scatter,
        dir: "up",
        progress: 0,
        baseSpeed: 0.0031, // tiles per ms
        state: "inhouse", // inhouse -> exiting -> active -> frightened -> eaten
        exitDelay: 0,
      };
    });
  }

  let pacman = makePacman();
  let ghosts = makeGhosts();

  // stagger ghost exit
  function setupGhostDelays() {
    ghosts[0].state = "exiting";
    ghosts[0].exitDelay = 0;
    ghosts[1].exitDelay = 1500;
    ghosts[2].exitDelay = 4000;
    ghosts[3].exitDelay = 6500;
  }

  let globalModeTimer = 0;
  let globalMode = "scatter"; // scatter | chase
  const MODE_SEQUENCE = [
    { mode: "scatter", dur: 7000 },
    { mode: "chase", dur: 20000 },
    { mode: "scatter", dur: 7000 },
    { mode: "chase", dur: 20000 },
    { mode: "scatter", dur: 5000 },
    { mode: "chase", dur: 999999 },
  ];
  let modeIndex = 0;
  let modeElapsed = 0;

  function resetPositions() {
    pacman = makePacman();
    ghosts = makeGhosts();
    setupGhostDelays();
    modeIndex = 0;
    modeElapsed = 0;
    globalMode = "scatter";
    frightenedTimer = 0;
    ghostEatCombo = 0;
    handleEatAt(pacman.row, pacman.col);
  }

  function resetLevel() {
    board = MAZE.map((row) => row.split(""));
    dotsRemaining = countDots();
    resetPositions();
    wonFlag = false;
  }

  // ---------- Input ----------
  const keyMap = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
    W: "up", S: "down", A: "left", D: "right",
  };

  window.addEventListener("keydown", (e) => {
    if (keyMap[e.key]) {
      pacman.nextDir = keyMap[e.key];
      e.preventDefault();
    } else if (e.key === "p" || e.key === "P") {
      togglePause();
    } else if (e.key === "Enter" && !running) {
      startGame();
    }
  });

  document.querySelectorAll("#touch-controls button").forEach((btn) => {
    btn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      pacman.nextDir = btn.dataset.dir;
    }, { passive: false });
    btn.addEventListener("click", () => {
      pacman.nextDir = btn.dataset.dir;
    });
  });

  // swipe support
  let touchStart = null;
  canvas.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener("touchend", (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      pacman.nextDir = dx > 0 ? "right" : "left";
    } else if (Math.abs(dy) > 10) {
      pacman.nextDir = dy > 0 ? "down" : "up";
    }
    touchStart = null;
  }, { passive: true });

  // ---------- Overlay ----------
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlay-title");
  const overlayText = document.getElementById("overlay-text");
  const overlayBtn = document.getElementById("overlay-btn");

  overlayBtn.addEventListener("click", () => {
    if (gameOverFlag || wonFlag) {
      score = 0;
      lives = 3;
      resetLevel();
      gameOverFlag = false;
      wonFlag = false;
      updateHud();
    }
    startGame();
  });

  function startGame() {
    overlay.classList.add("hidden");
    running = true;
    paused = false;
  }

  function togglePause() {
    if (!running || gameOverFlag || wonFlag) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = "PAUSED";
      overlayText.innerHTML = "P で再開";
      overlayBtn.textContent = "RESUME";
      overlay.classList.remove("hidden");
    } else {
      overlay.classList.add("hidden");
    }
  }

  function showEnd(won) {
    running = false;
    gameOverFlag = !won;
    wonFlag = won;
    if (score > highscore) {
      highscore = score;
      localStorage.setItem("pacman_highscore", String(highscore));
    }
    overlayTitle.textContent = won ? "YOU WIN!" : "GAME OVER";
    overlayText.innerHTML = "SCORE: " + score + (won ? "<br>おめでとう！" : "<br>もう一度挑戦しよう");
    overlayBtn.textContent = "RESTART";
    document.getElementById("highscore").textContent = highscore;
    overlay.classList.remove("hidden");
  }

  function updateHud() {
    document.getElementById("score").textContent = score;
    document.getElementById("lives").textContent = "♥".repeat(Math.max(lives, 0));
  }

  // ---------- Movement helpers ----------
  function canMove(entityType, row, col, dir) {
    const d = DIR[dir];
    const nr = row + d.y;
    const nc = col + d.x;
    return !isWallFor(entityType, nr, nc);
  }

  function wrapCol(col) {
    if (col < 0) return COLS - 1;
    if (col >= COLS) return 0;
    return col;
  }

  function handleEatAt(row, col) {
    const ch = board[row] ? board[row][col] : null;
    if (ch === ".") {
      board[row][col] = " ";
      score += 10;
      dotsRemaining--;
      updateHud();
    } else if (ch === "o") {
      board[row][col] = " ";
      score += 50;
      dotsRemaining--;
      frightenedTimer = frightenedTotal;
      ghostEatCombo = 0;
      ghosts.forEach((g) => {
        if (g.state === "active") g.state = "frightened";
      });
      updateHud();
    }
    if (dotsRemaining <= 0) {
      showEnd(true);
    }
  }

  // Decide pacman's direction at a tile-center decision point.
  function decidePacmanDir() {
    if (pacman.nextDir !== pacman.dir && canMove("pacman", pacman.row, pacman.col, pacman.nextDir)) {
      pacman.dir = pacman.nextDir;
    } else if (!canMove("pacman", pacman.row, pacman.col, pacman.dir)) {
      pacman.dir = "none";
    }
  }

  function updatePacman(dt) {
    if (pacman.progress <= 0) {
      pacman.progress = 0;
      decidePacmanDir();
    }

    if (pacman.dir !== "none") {
      pacman.progress += pacman.speed * dt;
      if (pacman.progress >= 1) {
        const d = DIR[pacman.dir];
        pacman.row += d.y;
        pacman.col = wrapCol(pacman.col + d.x);
        pacman.progress -= 1;
        handleEatAt(pacman.row, pacman.col);
        decidePacmanDir();
        if (pacman.dir === "none") pacman.progress = 0;
      }
    }

    // mouth animation
    pacman.mouth += pacman.mouthDir * dt * 0.012;
    if (pacman.mouth > 1) { pacman.mouth = 1; pacman.mouthDir = -1; }
    if (pacman.mouth < 0) { pacman.mouth = 0; pacman.mouthDir = 1; }
  }

  function distSq(ax, ay, bx, by) {
    const dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  }

  function ghostTarget(g) {
    if (g.state === "frightened") return null; // random
    if (g.state === "eaten") return tileCenter(g.homeRow, g.homeCol);
    if (globalMode === "scatter") return tileCenter(g.scatterTarget.row, g.scatterTarget.col);
    // chase mode, personality-based
    const pRow = pacman.row, pCol = pacman.col;
    const pDir = DIR[pacman.dir] || DIR.none;
    if (g.name === "blinky") {
      return tileCenter(pRow, pCol);
    } else if (g.name === "pinky") {
      return tileCenter(pRow + pDir.y * 4, pCol + pDir.x * 4);
    } else if (g.name === "inky") {
      return tileCenter(pRow + pDir.y * 2, pCol + pDir.x * 2);
    } else {
      const dTiles = Math.hypot(g.row - pRow, g.col - pCol);
      if (dTiles > 8) return tileCenter(pRow, pCol);
      return tileCenter(g.scatterTarget.row, g.scatterTarget.col);
    }
  }

  // Decide a ghost's direction while exiting the ghost house: head to the
  // door column, then straight up through the door into the corridor.
  function decideExitDir(g) {
    if (g.row <= 7) {
      g.state = "active";
      g.dir = Math.random() < 0.5 ? "left" : "right";
    } else if (g.row >= 9 && g.col !== 10) {
      g.dir = g.col < 10 ? "right" : "left";
    } else {
      g.dir = "up";
    }
  }

  // Decide a ghost's direction at a tile-center decision point while active,
  // frightened, or heading home after being eaten.
  function decideActiveDir(g) {
    const target = ghostTarget(g);
    const dirs = ["up", "down", "left", "right"];
    let candidates = dirs.filter((dname) => dname !== opposite(g.dir) && canMove("ghost", g.row, g.col, dname));
    if (candidates.length === 0) {
      candidates = dirs.filter((dname) => canMove("ghost", g.row, g.col, dname));
    }
    if (candidates.length === 0) {
      g.dir = "none";
      return;
    }
    if (g.state === "frightened" || !target) {
      g.dir = candidates[Math.floor(Math.random() * candidates.length)];
    } else {
      let best = candidates[0];
      let bestD = Infinity;
      for (const dname of candidates) {
        const d = DIR[dname];
        const c = tileCenter(g.row + d.y, g.col + d.x);
        const dd = distSq(c.x, c.y, target.x, target.y);
        if (dd < bestD) { bestD = dd; best = dname; }
      }
      g.dir = best;
    }
  }

  function decideGhostDir(g) {
    if (g.state === "exiting") {
      decideExitDir(g);
    } else if (g.state === "eaten" && g.row === g.homeRow && g.col === g.homeCol) {
      g.state = "exiting";
      decideExitDir(g);
    } else {
      decideActiveDir(g);
    }
  }

  function updateGhost(g, dt) {
    if (g.state === "inhouse") {
      g.exitDelay -= dt;
      if (g.exitDelay <= 0) g.state = "exiting";
      return;
    }

    const speed = g.state === "frightened" ? g.baseSpeed * 0.6
      : g.state === "eaten" ? g.baseSpeed * 2.2
      : g.baseSpeed;

    if (g.progress <= 0) {
      g.progress = 0;
      decideGhostDir(g);
    }

    if (g.dir === "none") return;

    g.progress += speed * dt;
    if (g.progress >= 1) {
      const d = DIR[g.dir];
      g.row += d.y;
      g.col = wrapCol(g.col + d.x);
      g.progress -= 1;
      decideGhostDir(g);
      if (g.dir === "none") g.progress = 0;
    }
  }

  function updateGlobalMode(dt) {
    if (frightenedTimer > 0) return; // hold scatter/chase progression during fright
    modeElapsed += dt;
    const cur = MODE_SEQUENCE[modeIndex];
    if (modeElapsed >= cur.dur) {
      modeElapsed = 0;
      modeIndex = Math.min(modeIndex + 1, MODE_SEQUENCE.length - 1);
      globalMode = MODE_SEQUENCE[modeIndex].mode;
    } else {
      globalMode = cur.mode;
    }
  }

  function checkCollisions() {
    const pPos = entityPixelPos(pacman);
    for (const g of ghosts) {
      if (g.state === "inhouse" || g.state === "exiting" || g.state === "eaten") continue;
      const gPos = entityPixelPos(g);
      const d = Math.hypot(gPos.x - pPos.x, gPos.y - pPos.y);
      if (d < TILE * 0.6) {
        if (g.state === "frightened") {
          g.state = "eaten";
          ghostEatCombo++;
          score += 200 * ghostEatCombo;
          updateHud();
        } else {
          loseLife();
          return;
        }
      }
    }
  }

  function loseLife() {
    lives--;
    updateHud();
    if (lives <= 0) {
      showEnd(false);
      return;
    }
    running = false;
    setTimeout(() => {
      resetPositions();
      running = true;
    }, 900);
  }

  // ---------- Rendering ----------
  function drawMaze() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const ch = board[r][c];
        const x = c * TILE, y = r * TILE;
        if (ch === "#") {
          ctx.strokeStyle = "#2121de";
          ctx.lineWidth = 3;
          ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
        } else if (ch === "-") {
          ctx.strokeStyle = "#ff9dd6";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + 2, y + TILE / 2);
          ctx.lineTo(x + TILE - 2, y + TILE / 2);
          ctx.stroke();
        } else if (ch === ".") {
          ctx.fillStyle = "#ffd9a0";
          ctx.beginPath();
          ctx.arc(x + TILE / 2, y + TILE / 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (ch === "o") {
          const pulse = 3.5 + Math.sin(performance.now() / 150) * 1.2;
          ctx.fillStyle = "#ffd9a0";
          ctx.beginPath();
          ctx.arc(x + TILE / 2, y + TILE / 2, pulse, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  function drawPacman() {
    const { x, y } = entityPixelPos(pacman);
    const angleMap = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2, none: 0 };
    const baseAngle = angleMap[pacman.dir] ?? 0;
    const openness = 0.05 + pacman.mouth * 0.22;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(baseAngle);
    ctx.fillStyle = "#ffe600";
    ctx.beginPath();
    ctx.arc(0, 0, TILE / 2 - 1, openness * Math.PI, (2 - openness) * Math.PI);
    ctx.lineTo(0, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawGhost(g) {
    const { x, y } = entityPixelPos(g);
    const r = TILE / 2 - 1;
    let color = g.color;
    if (g.state === "frightened") {
      color = frightenedTimer < 1500 && Math.floor(frightenedTimer / 200) % 2 === 0 ? "#ffffff" : "#2121ff";
    } else if (g.state === "eaten") {
      color = "rgba(255,255,255,0.35)";
    }
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, Math.PI, 0);
    ctx.lineTo(x + r, y + r);
    const spikes = 4;
    for (let i = 0; i <= spikes; i++) {
      const sx = x + r - (2 * r * i) / spikes;
      const sy = y + (i % 2 === 0 ? r : r - 5);
      ctx.lineTo(sx, sy);
    }
    ctx.lineTo(x - r, y + r);
    ctx.closePath();
    ctx.fill();

    if (g.state !== "eaten") {
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(x - 5, y - 3, 3.2, 0, Math.PI * 2);
      ctx.arc(x + 5, y - 3, 3.2, 0, Math.PI * 2);
      ctx.fill();
      const d = DIR[g.dir] || DIR.none;
      ctx.fillStyle = "#00308f";
      ctx.beginPath();
      ctx.arc(x - 5 + d.x * 1.5, y - 3 + d.y * 1.5, 1.6, 0, Math.PI * 2);
      ctx.arc(x + 5 + d.x * 1.5, y - 3 + d.y * 1.5, 1.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // eyes only, floating home
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(x - 5, y - 1, 3.2, 0, Math.PI * 2);
      ctx.arc(x + 5, y - 1, 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function render() {
    drawMaze();
    ghosts.forEach(drawGhost);
    drawPacman();
  }

  // ---------- Main loop ----------
  let lastTime = performance.now();
  function loop(now) {
    let dt = now - lastTime;
    lastTime = now;
    dt = Math.min(dt, 40); // clamp for tab-switch jumps

    if (running && !paused) {
      if (frightenedTimer > 0) {
        frightenedTimer -= dt;
        if (frightenedTimer <= 0) {
          frightenedTimer = 0;
          ghosts.forEach((g) => { if (g.state === "frightened") g.state = "active"; });
        }
      }
      updateGlobalMode(dt);
      updatePacman(dt);
      ghosts.forEach((g) => updateGhost(g, dt));
      checkCollisions();
    }
    render();
    requestAnimationFrame(loop);
  }

  // ---------- Init ----------
  resetLevel();
  updateHud();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
